<!doctype html>
<html lang="ja">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>YomitanQ</title>
<meta name="description" content="読谷あかねの検索可能クイズ">
<meta property="og:type" content="website">
<meta property="og:site_name" content="YomitanQ">
<meta property="og:title" content="YomitanQ">
<meta property="og:description" content="検索可能クイズYomitanQ">
<meta property="og:url" content="https://yomitanakane.com/YomitanQ/">
<meta property="og:image" content="https://yomitanakane.com/YomitanQ/Images/Matome.png">
<meta property="og:image:width" content="3840">
<meta property="og:image:height" content="2160">
<meta name="twitter:card" content="summary_large_image">
<meta name="twitter:title" content="YomitanQ">
<meta name="twitter:description" content="検索可能クイズYomitanQ">
<meta name="twitter:image" content="https://yomitanakane.com/YomitanQ/Images/Matome.png">
<link rel="canonical" href="https://yomitanakane.com/YomitanQ/">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Noto+Sans+JP:wght@400;700&display=swap">
<style>
@font-face{font-family:"GreekFix";font-weight:400;src:local("Arial"),local("ArialMT"),local("Helvetica Neue"),local("HelveticaNeue"),local("Roboto"),local("Roboto-Regular");unicode-range:U+0370-03FF}
@font-face{font-family:"GreekFix";font-weight:700;src:local("Arial Bold"),local("Arial-BoldMT"),local("Helvetica Neue Bold"),local("HelveticaNeue-Bold"),local("Roboto Bold"),local("Roboto-Bold");unicode-range:U+0370-03FF}
:root{--bg:#f4f4f4;--fg:#111;--line:#111;--soft-line:#b5b5b5;--red:#d40000}
*{box-sizing:border-box;border-radius:0}
html{font-size:16px;-webkit-text-size-adjust:100%;scrollbar-gutter:stable}
body{margin:0;background:var(--bg);color:var(--fg);font-family:"GreekFix","Noto Sans JP","Hiragino Kaku Gothic ProN","Hiragino Sans","Yu Gothic",Meiryo,sans-serif;line-height:1.7}
body.noscroll{overflow:hidden}
a{color:#0645ad}
button,input,textarea{font:inherit;color:inherit;border-radius:0;-webkit-appearance:none;appearance:none}
input:focus,textarea:focus{outline:none}
input::placeholder,textarea::placeholder{color:#8c8c8c;opacity:1}
.wrap{display:flex;flex-direction:column;min-height:100vh;max-width:1200px;margin:0 auto;padding:0 20px}
main{flex:1}
.topbar{display:flex;flex-wrap:wrap;align-items:flex-start;justify-content:space-between;gap:12px 16px;padding:36px 0 0;--tw:250px}
.brand{flex:1 1 0;min-width:var(--tw)}
.title{width:var(--tw)}
.title img{display:block;width:var(--tw);height:auto;margin:calc(var(--tw) * -0.04) 0 calc(var(--tw) * -0.041) calc(var(--tw) * -0.047)}
.topbtns{display:flex;flex-wrap:nowrap;gap:8px;margin-left:auto}
.btn{display:inline-block;background:#fff;color:var(--fg);border:2px solid var(--line);padding:5px 14px;font-weight:700;font-size:.95rem;line-height:1.4;text-decoration:none;cursor:pointer;transition:background .12s,color .12s;white-space:nowrap}
.btn:hover,.btn:focus-visible{background:#000;color:#fff}
.btn:disabled{cursor:default;background:#fff;color:var(--fg)}
.btn-lg{font-size:1rem;padding:8px 22px}
.btn-sm{font-size:.8rem;padding:2px 10px}
.input{width:100%;min-width:0;font-size:1.05rem;padding:8px 12px;border:2px solid var(--line);background:#fff}
.grid{display:grid;grid-template-columns:repeat(5,minmax(0,1fr));gap:12px;align-items:start;margin-top:28px}
.tile{position:relative;display:block;width:100%;padding:0;border:2px solid var(--soft-line);background:#fff;cursor:pointer}
.tile:hover,.tile:focus-visible{border-color:var(--line);outline:none}
.tile img{display:block;width:100%;height:auto}
.shade{position:absolute;inset:0;display:none;align-items:center;justify-content:center;background:rgba(0,0,0,.6)}
.shade span{background:#fff;color:var(--red);font-weight:700;font-size:.85rem;letter-spacing:.1em;padding:0 10px}
.tile.solved .shade{display:flex}
.complete{margin:40px 0 0;text-align:center}
.complete-title{margin:0;color:var(--red);font-weight:700;font-size:1.4rem}
.complete-omake{margin:10px 0 0;color:var(--fg);overflow-wrap:anywhere}
.share{text-align:center;margin-top:48px}
.results{text-align:center;margin-top:40px}
.credit{margin:48px 0 0;padding:0 0 24px;text-align:center;font-size:.85rem}
.overlay{position:fixed;inset:0;z-index:200;overflow-y:auto;scrollbar-gutter:stable;background:rgba(0,0,0,.5);padding:32px 16px}
.panel{position:relative;max-width:760px;margin:0 auto;background:#fff;border:2px solid var(--line);padding:32px 36px 28px;font-size:1.02rem}
.panel h2{margin:0 0 14px;font-size:1.3rem;padding-right:48px}
.panel p{margin:0 0 .5em}
.panel a:not(.linkbtn){text-underline-offset:.28em}
.panel a.plain,.panel a[href^="mailto:"]{color:var(--fg)}
.panel p.bullet{padding-left:1em;text-indent:-1em}
.panel .sp{height:.7em}
.panel hr.sep{border:0;border-top:1px solid var(--line);margin:.9em 0}
.close{position:absolute;top:10px;right:10px;width:42px;height:42px;font-size:24px;line-height:1;background:#fff;border:2px solid var(--line);cursor:pointer}
.close:hover,.close:focus-visible{background:#000;color:#fff}
.linkbtn{display:inline-block;text-indent:0;margin:2px 3px;padding:0 10px;border:2px solid var(--line);background:#fff;color:var(--fg);font-weight:700;text-decoration:none;line-height:1.6}
.linkbtn:hover,.linkbtn:focus-visible{background:#000;color:#fff}
.intl{margin-top:22px;border:2px solid var(--line)}
.intl summary{display:flex;justify-content:space-between;cursor:pointer;padding:8px 14px;font-weight:700;list-style:none;background:#fff}
.intl summary::-webkit-details-marker{display:none}
.intl summary::after{content:"▼"}
.intl[open] summary::after{content:"▲"}
.intl summary:hover{background:#000;color:#fff}
.intl .intl-body{padding:12px 14px 4px;border-top:2px solid var(--line)}
.qview{position:fixed;inset:0;z-index:100;overflow-y:auto;scrollbar-gutter:stable;background:rgba(244,244,244,.82);padding:20px 16px 40px}
.qpanel{--iw:max(min(calc(100vw - 68px),480px),min(calc(100vw - 68px),960px,calc((100vh - 260px) * var(--ar,1.7778))));width:calc(var(--iw) + 36px);max-width:100%;margin:0 auto;padding:10px 16px 18px;background:#fff;border:2px solid var(--line)}
.qbar{display:flex;align-items:stretch;justify-content:flex-end;gap:10px;margin-bottom:10px}
.qbar .btn{display:inline-flex;align-items:center;height:38px}
.qclose{width:38px;height:38px;font-size:22px;line-height:1;background:#fff;border:2px solid var(--line);cursor:pointer}
.qclose:hover,.qclose:focus-visible{background:#000;color:#fff}
.qimg{display:block;width:100%;height:auto;border:1px solid var(--soft-line)}
.answer{margin-top:14px}
.answer .row{display:flex;gap:10px}
.ansmsg{margin-top:8px}
.ansmsg p{margin:0}
.wrong{font-size:1.35rem;font-weight:700}
.result{border:2px solid var(--soft-line);padding:14px 18px;text-align:left}
.result .ok{font-size:1.9rem;font-weight:700;color:var(--red);margin:0;line-height:1.3}
.result .main-ans{font-size:1.45rem;font-weight:700;margin:4px 0 0;line-height:1.4;word-break:break-word}
.result .alt{font-size:.85rem;margin:2px 0 0}
.result .supp{margin-top:12px;padding-top:12px;border-top:1px solid var(--soft-line);font-size:.95rem;white-space:pre-wrap;overflow-wrap:anywhere}
@media (max-width:640px){
  html{font-size:15px}
  input,textarea{font-size:16px !important}
  .wrap{padding:0 14px}
  .topbar{--tw:120px;padding-top:24px;column-gap:10px}
  .topbtns .btn{font-size:.85rem;padding:4px 8px}
  .grid{grid-template-columns:1fr;gap:14px}
  .panel{padding:60px 16px 20px}
  .panel h2{padding-right:0}
  .overlay{padding:12px 8px}
  .qview{padding:10px 8px 30px}
  .qpanel{--iw:calc(100vw - 52px);padding:8px 10px 14px;width:calc(var(--iw) + 24px)}
}
</style>
</head>
<body>
<div id="app" data-nosnippet></div>
<noscript><p data-nosnippet style="text-align:center;padding:40px 16px">JavaScriptを有効にしてください。</p></noscript>
<script src="answers.js"></script>
<script src="app.js"></script>
</body>
</html>
