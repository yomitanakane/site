<body>

<!-- ===================== スタート画面 ===================== -->
<section id="screen-start" class="screen">
  <div class="container">
    <h1 class="title">答えが激ムズのアナグラム</h1>
    <p class="description">
      答えが一般的に知られていない単語になるアナグラムクイズです。
      <br />
      勘で答えるもよし、知識で答えてもよし。
      <br />
      ランダムな5問が出題され、タイムが計測されます。
      <br />
      ヒントボタンを押すと位置の正しい文字が緑色になります。
      <br />
      配信での使用も可能です。ご自由にお取り扱いください。
      <br />
      問題は思いついたら追加します。現在は全<span id="question-count">0</span>問です。
    </p>
    <button id="btn-start" class="btn btn-primary">スタート</button>
  </div>
  <p class="credit">
    クレジット　<a href="https://yomitanakane.com/" target="_blank" rel="noopener noreferrer">読谷あかね</a>
  </p>
</section>

<!-- ===================== 問題画面 ===================== -->
<section id="screen-quiz" class="screen hidden">
  <div class="container">
    <div class="quiz-header">
      <span class="quiz-progress"><span id="question-index">1</span> / <span id="question-total">5</span> 問</span>
      <span class="quiz-timer" id="timer">0s</span>
    </div>

    <p class="quiz-prompt" id="quiz-prompt"></p>

    <div class="tiles" id="tiles"></div>

    <div class="quiz-controls">
      <button id="btn-hint" class="btn btn-secondary">ヒント</button>
      <button id="btn-giveup" class="btn btn-secondary">ギブアップ</button>
    </div>

    <div class="result-box hidden" id="answer-box">
      <p class="answer-mark" id="answer-mark">正解</p>
      <p class="answer-word" id="answer-word"></p>
      <p class="answer-explanation" id="answer-explanation"></p>
      <div class="answer-controls">
        <button id="btn-search" class="btn btn-primary hidden">答えのワードを検索</button>
        <button id="btn-next" class="btn btn-primary">次の問題へ</button>
      </div>
    </div>
  </div>
</section>

<!-- ===================== 結果画面 ===================== -->
<section id="screen-result" class="screen hidden">
  <div class="container">
    <h2 class="title">結果</h2>
    <p class="result-nohint hidden" id="result-nohint">ノーヒントクリア</p>
    <p class="result-score" id="result-score">5問中0問正解</p>
    <p class="result-time-label">5問クリアタイム</p>
    <p class="result-time" id="result-time">0s</p>

    <button id="btn-share" class="btn btn-secondary">Xでシェアする</button>

    <table class="review-table" id="review-table">
      <thead>
        <tr>
          <th>答え</th>
          <th>説明</th>
        </tr>
      </thead>
      <tbody id="review-table-body"></tbody>
    </table>

    <button id="btn-home" class="btn btn-primary">ホーム画面に戻る</button>
    <button id="btn-secret" class="btn-secret-trigger" aria-label="secret" tabindex="-1"></button>
  </div>
</section>

<!-- ===================== 全問題の一覧(隠しページ) ===================== -->
<div class="secret-overlay hidden" id="secret-overlay">
  <div class="secret-panel">
    <div class="secret-header">
      <h3>全問題の一覧</h3>
      <button id="btn-secret-close" class="btn-close" aria-label="閉じる">×</button>
    </div>
    <button id="btn-secret-toggle" class="secret-toggle">▼タップで全問題が表示されます。ネタバレ注意！</button>
    <div class="secret-table-wrap">
      <table class="secret-table hidden" id="secret-table">
        <thead>
          <tr>
            <th>答え</th>
            <th>読み</th>
            <th>説明</th>
          </tr>
        </thead>
        <tbody id="secret-table-body"></tbody>
      </table>
    </div>
  </div>
</div>

<script src="questions.js"></script>
<script src="app.js"></script>
</body>
</html>
