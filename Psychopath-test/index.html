<!DOCTYPE html>
<html lang="ja">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1.0" />
<title>サイコパステスト</title>
<meta name="description" content="あなたの回答のサイコパス度を調べる" />
<meta property="og:title" content="サイコパステスト" />
<meta property="og:description" content="あなたの回答のサイコパス度を調べる" />
<meta property="og:image" content="https://yomitanakane.com/Psychopath-test/Icon_Psycopass.png" />
<meta property="og:image:width" content="150" />
<meta property="og:image:height" content="150" />
<meta property="og:type" content="website" />
<meta property="og:url" content="https://yomitanakane.com/Psychopath-test" />
<meta property="og:site_name" content="サイコパステスト" />
<meta name="twitter:card" content="summary" />
<meta name="twitter:title" content="サイコパステスト" />
<meta name="twitter:description" content="あなたの回答のサイコパス度を調べる" />
<meta name="twitter:image" content="https://yomitanakane.com/Psychopath-test/Icon_Psycopass.png" />
<link rel="icon" type="image/png" href="Icon_Psycopass.png" />
<link rel="apple-touch-icon" href="Icon_Psycopass.png" />
<link rel="preconnect" href="https://fonts.googleapis.com" />
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
<link href="https://fonts.googleapis.com/css2?family=Noto+Serif+JP:wght@400;700;900&display=swap" rel="stylesheet" />
<link rel="stylesheet" href="style.css" />
</head>
<body>

<main class="frame">

  <!-- ===================== 質問画面 ===================== -->
  <section id="screen-quiz">
    <h1 class="title">サイコパステスト</h1>
    <form id="quiz-form" novalidate>
      <div id="questions"></div>
      <div class="form-footer">
        <p id="error" class="error" hidden>すべての質問に回答してください。</p>
        <button type="submit" id="btn-submit" class="btn btn-submit">送信</button>
      </div>
    </form>
  </section>

  <!-- ===================== 結果画面 ===================== -->
  <section id="screen-result" hidden>
    <p class="result-lead">あなたの回答のサイコパス度は</p>
    <p class="result-score"><span id="score">0</span><span class="result-unit">%</span></p>
    <p class="result-answers" id="result-answers"></p>
    <p class="result-note" id="result-note" hidden>※これ以上の要素はありません</p>
    <div class="result-buttons">
      <button type="button" id="btn-retry" class="btn">もう一度</button>
      <button type="button" id="btn-share" class="btn">シェア</button>
    </div>
  </section>

</main>

<script src="app.js"></script>
</body>
</html>
